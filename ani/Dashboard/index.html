<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard · Ani</title>
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="../Chat/chat.css">
</head>
<body data-page="dashboard">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="page-head">
            <div>
                <h1 id="greeting">Dashboard</h1>
                <p id="todayLabel"></p>
            </div>
        </header>

        <div id="loadError" class="error-box" hidden></div>
        <section class="stats" id="stats"></section>

        <div class="dash-grid">
            <div class="stack">
                <section class="card">
                    <div class="card-head">
                        <div>
                            <h2>Plot overview</h2>
                            <p>Select a plot to see its details.</p>
                        </div>
                        <a class="btn btn-soft btn-sm" href="../Plots/plots.html">Manage plots</a>
                    </div>
                    <div class="plot-grid" id="plotGrid"></div>
                </section>

                <section class="card">
                    <div class="card-head">
                        <h2>Recent harvests</h2>
                        <a class="btn btn-soft btn-sm" href="../Inventory/inventory.html#harvests">All harvests</a>
                    </div>
                    <ul class="mini-list" id="harvestList"></ul>
                </section>
            </div>

            <div class="stack">
                <section class="card">
                    <div class="card-head">
                        <div>
                            <h2>All tasks</h2>
                            <p>Every task across your plots, pending first.</p>
                        </div>
                        <a class="btn btn-soft btn-sm" href="../Tasks/tasks.html">Manage</a>
                    </div>
                    <div class="chips" id="taskFilter" style="margin-bottom:12px"></div>
                    <ul class="task-list" id="taskList"></ul>
                </section>

                <section class="card">
                    <div class="card-head">
                        <h2>Seed inventory</h2>
                        <a class="btn btn-soft btn-sm" href="../Inventory/inventory.html">Inventory</a>
                    </div>
                    <ul class="mini-list" id="seedList"></ul>
                </section>
            </div>
        </div>
    </main>

    <div class="modal" id="plotModal" hidden>
        <div class="modal-card wide" role="dialog" aria-modal="true" aria-labelledby="plotTitle">
            <div class="modal-head">
                <h2 id="plotTitle">Plot</h2>
                <button type="button" class="modal-x" data-close aria-label="Close"><i data-icon="x"></i></button>
            </div>
            <div class="modal-body" id="plotBody"></div>
            <div class="modal-foot">
                <button type="button" class="btn btn-ghost" data-close>Close</button>
                <a class="btn" id="plotManage" href="../Plots/plots.html">Manage this plot</a>
            </div>
        </div>
    </div>

    <script src="../assets/js/core.js"></script>
    <script src="../assets/js/shell.js"></script>
    <script src="../assets/js/plot-view.js"></script>
    <script src="dashboard.js"></script>
    <script src="../Chat/chat.js"></script>
</body>
</html>
