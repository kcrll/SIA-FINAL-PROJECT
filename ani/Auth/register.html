<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account · Ani</title>
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body data-page="auth">
    <div class="auth">
        <aside class="auth-side">
            <div>
                <a class="brand" href="../landing.html"><i data-icon="leaf" data-size="26"></i><span>Ani</span></a>
                <h2>Start tracking your rice farm.</h2>
                <p>Plots, tasks, supplies, harvests and finances, together in one simple place.</p>
            </div>
            <img src="../assets/images/Palay.png" alt="">
        </aside>

        <main class="auth-main">
            <form class="auth-card" id="registerForm" novalidate>
                <h1>Create account</h1>
                <p class="lead">It only takes a minute.</p>
                <div class="error" id="formError" role="alert" hidden></div>
                <div class="form-grid">
                    <label class="field"><span>Full name</span><input name="full_name" autocomplete="name" maxlength="100" required autofocus></label>
                    <label class="field"><span>Phone number</span><input type="tel" name="phone" autocomplete="tel" required></label>
                    <label class="field"><span>Username</span><input name="username" autocomplete="username" maxlength="30" required><small class="hint">Letters, numbers and underscore, 3-30 characters.</small></label>
                </div>
                <div class="form-grid two">
                    <label class="field"><span>Password</span><input type="password" name="password" autocomplete="new-password" minlength="6" required></label>
                    <label class="field"><span>Confirm password</span><input type="password" name="confirm_password" autocomplete="new-password" required></label>
                </div>
                <button type="submit" class="btn btn-block">Create account</button>
                <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
            </form>
        </main>
    </div>

    <script src="../assets/js/core.js"></script>
    <script src="auth.js"></script>
</body>
</html>
