<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finance · Ani</title>
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="finance.css">
    <link rel="stylesheet" href="../Chat/chat.css">
</head>
<body data-page="finance">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="page-head">
            <div>
                <h1>Finance</h1>
                <p>Record what you spend and earn, per plot or for the whole farm.</p>
            </div>
            <div class="filters">
                <select id="period" class="input" aria-label="Period">
                    <option value="all">All time</option>
                    <option value="week">Last 7 days</option>
                    <option value="month">This month</option>
                    <option value="year">This year</option>
                </select>
                <select id="plotFilter" class="input" aria-label="Plot"></select>
            </div>
        </header>

        <div id="loadError" class="error-box" hidden></div>
        <section class="stats" id="stats"></section>

        <div class="fin-layout">
            <section class="card">
                <div class="card-head"><h2>New transaction</h2></div>
                <form id="financeForm" class="form-grid">
                    <input type="hidden" name="transaction_type" value="Expense">
                    <input type="hidden" name="category">
                    <div class="field full">
                        <span>Type</span>
                        <div class="segmented" id="typeToggle">
                            <button type="button" class="active" data-type="Expense">Expense</button>
                            <button type="button" data-type="Income">Income</button>
                        </div>
                    </div>
                    <div class="field full"><span>Category</span><div class="chips" id="categories"></div></div>
                    <label class="field"><span>Amount (₱)</span><input type="number" name="amount" min="0.01" step="0.01" required placeholder="0.00"></label>
                    <label class="field"><span>Date</span><input type="date" name="transaction_date" required></label>
                    <label class="field full"><span>Plot</span><select name="plot_id" id="formPlot"></select></label>
                    <label class="field full"><span>Notes</span><input name="notes" maxlength="500" placeholder="Optional"></label>
                    <button type="submit" class="btn full">Add transaction</button>
                </form>
            </section>

            <section class="card">
                <div class="card-head">
                    <div><h2>History</h2><p id="historyCount"></p></div>
                </div>
                <ul class="tx-list" id="txList"></ul>
            </section>
        </div>
    </main>

    <script src="../assets/js/core.js"></script>
    <script src="../assets/js/shell.js"></script>
    <script src="finance.js"></script>
    <script src="../Chat/chat.js"></script>
</body>
</html>
