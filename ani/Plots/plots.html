<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plots · Ani</title>
    <link rel="stylesheet" href="../assets/css/app.css">
    <link rel="stylesheet" href="../Chat/chat.css">
</head>
<body data-page="plots">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <header class="page-head">
            <div>
                <h1>Plots</h1>
                <p>Track every rice plot, its planting and its progress.</p>
            </div>
            <button type="button" class="btn" id="addPlotBtn"><i data-icon="plus"></i> Add plot</button>
        </header>

        <section class="card">
            <div class="card-head">
                <div>
                    <h2>Plot overview</h2>
                    <p>Select a plot to see its details and manage it.</p>
                </div>
                <div class="chips" id="statusFilter"></div>
            </div>
            <div id="loadError" class="error-box" hidden></div>
            <div class="plot-grid" id="plotGrid"></div>
        </section>
    </main>

    <!-- Add plot -->
    <div class="modal" id="addModal" hidden>
        <form class="modal-card" id="addForm" role="dialog" aria-modal="true" aria-labelledby="addTitle">
            <div class="modal-head">
                <h2 id="addTitle">Add plot</h2>
                <button type="button" class="modal-x" data-close aria-label="Close"><i data-icon="x"></i></button>
            </div>
            <div class="modal-body form-grid">
                <label class="field full"><span>Plot name</span><input name="name" required maxlength="100" placeholder="e.g. Plot A1"></label>
                <label class="field full"><span>Status</span>
                    <select name="status">
                        <option>Available</option>
                        <option>Planted</option>
                        <option>Maintenance</option>
                    </select>
                </label>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn btn-ghost" data-close>Cancel</button>
                <button type="submit" class="btn">Add plot</button>
            </div>
        </form>
    </div>

    <!-- Plot details -->
    <div class="modal" id="detailModal" hidden>
        <div class="modal-card wide" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
            <div class="modal-head">
                <div>
                    <h2 id="detailTitle">Plot</h2>
                    <p>Created <span id="detailCreated"></span></p>
                </div>
                <button type="button" class="modal-x" data-close aria-label="Close"><i data-icon="x"></i></button>
            </div>
            <div class="modal-body">
                <div id="detailBody"></div>

                <form id="editForm" class="detail-section" style="margin-top:12px">
                    <h3>Edit plot</h3>
                    <div class="form-grid">
                        <label class="field"><span>Plot name</span><input name="name" required maxlength="100"></label>
                        <label class="field"><span>Status</span>
                            <select name="status">
                                <option>Available</option>
                                <option>Planted</option>
                                <option>Maintenance</option>
                            </select>
                        </label>
                    </div>
                    <div style="margin-top:12px"><button type="submit" class="btn btn-soft btn-sm">Save changes</button></div>
                </form>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn btn-danger" id="deleteBtn" style="margin-right:auto"><i data-icon="trash" data-size="16"></i> Delete plot</button>
                <button type="button" class="btn btn-ghost" id="editPlantingBtn"><i data-icon="edit" data-size="16"></i> Edit planting</button>
                <button type="button" class="btn" id="newPlantingBtn"><i data-icon="sprout" data-size="16"></i> New planting</button>
            </div>
        </div>
    </div>

    <!-- Planting -->
    <div class="modal" id="plantingModal" hidden>
        <form class="modal-card" id="plantingForm" role="dialog" aria-modal="true" aria-labelledby="plantingTitle">
            <div class="modal-head">
                <div>
                    <h2 id="plantingTitle">New planting</h2>
                    <p id="plantingPlot"></p>
                </div>
                <button type="button" class="modal-x" data-close aria-label="Close"><i data-icon="x"></i></button>
            </div>
            <div class="modal-body form-grid">
                <input type="hidden" name="plot_id">
                <input type="hidden" name="planting_id">
                <label class="field full"><span>Rice variety</span>
                    <input name="variety" list="varieties" maxlength="150" placeholder="e.g. NSIC Rc 222">
                    <datalist id="varieties">
                        <option value="NSIC Rc 222"><option value="NSIC Rc 160"><option value="NSIC Rc 216">
                        <option value="IR64"><option value="Jasmine"><option value="Dinorado">
                    </datalist>
                </label>
                <label class="field"><span>Planting date</span><input type="date" name="planted_date" required></label>
                <label class="field"><span>Expected harvest</span><input type="date" name="expected_harvest_date"></label>
                <label class="field full"><span>Notes</span><textarea name="notes" placeholder="Optional"></textarea></label>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn btn-ghost" data-close>Cancel</button>
                <button type="submit" class="btn">Save planting</button>
            </div>
        </form>
    </div>

    <script src="../assets/js/core.js"></script>
    <script src="../assets/js/shell.js"></script>
    <script src="../assets/js/plot-view.js"></script>
    <script src="plots.js"></script>
    <script src="../Chat/chat.js"></script>
</body>
</html>
